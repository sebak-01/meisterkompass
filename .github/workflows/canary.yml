name: Live-site canary

# The @pytest.mark.network tests fetch real chamber pages and PDFs. They are the
# only thing that notices a chamber quietly restructuring its HTML or moving its
# Gebührenverzeichnis, so they are kept — just out of the fast PR suite, where a
# third-party site being down would otherwise fail unrelated changes.

on:
  schedule:
    - cron: "0 5 * * 1"   # Monday 05:00 UTC, before the weekly fee scrape
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run live-network tests
        run: python -m pytest tests/ -q -m network

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Live-site canary failed — a chamber page or fee PDF" \
               "likely changed. Check the failing test for which chamber."
